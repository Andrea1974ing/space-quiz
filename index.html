<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>Cosmic Quiz — Space Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7ff;
      --surface: #fff;
      --surface-soft: #f7f8ff;
      --ink: #202342;
      --muted: #737895;
      --line: #e6e8f2;
      --accent: #6857e8;
      --accent-soft: #efedff;
      --correct: #198754;
      --correct-soft: #e8f8ef;
      --wrong: #d94c62;
      --wrong-soft: #fff0f1;
      --shadow: 0 18px 50px rgb(39 42 89 / 9%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111426;
        --surface: #1b1f35;
        --surface-soft: #242943;
        --ink: #f0f1ff;
        --muted: #a5aac7;
        --line: #343952;
        --accent: #a89cff;
        --accent-soft: #302b52;
        --correct: #68dda0;
        --correct-soft: #173a31;
        --wrong: #ff8997;
        --wrong-soft: #452932;
        --shadow: 0 18px 50px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(124 109 255 / 11%), transparent 48%),
        var(--page);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { width: min(100%, 590px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      letter-spacing: 0;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-top { padding: 27px 30px 0; }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .score-star { color: #e9a928; }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8c79ff, #5b8df5);
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .question-area { padding: 28px 30px 30px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 27px);
      line-height: 1.25;
      letter-spacing: -.035em;
    }

    .prompt {
      min-height: 68px;
      margin: 0 0 22px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 58px;
      padding: 11px 15px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--surface-soft);
    }

    .answer:focus-visible, .next:focus-visible, .restart:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 3px;
    }

    .letter {
      display: grid;
      flex: 0 0 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
      color: var(--ink);
      animation: pop-in 340ms ease both;
    }

    .answer.correct .letter { background: var(--correct); color: #fff; }
    .answer.wrong { border-color: var(--wrong); background: var(--wrong-soft); animation: shake 360ms ease; }
    .answer.wrong .letter { background: var(--wrong); color: #fff; }
    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 29px;
      margin: 15px 0 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .feedback.good { color: var(--correct); }
    .feedback.bad { color: var(--wrong); }

    .actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 5px;
    }

    .next, .restart {
      min-height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .next:hover, .restart:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .next:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .result {
      padding: 42px 30px 36px;
      text-align: center;
      animation: pop-in 420ms ease both;
    }

    .result-emoji {
      display: grid;
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      place-items: center;
      border-radius: 26px;
      background: var(--accent-soft);
      font-size: 45px;
      animation: float 2.5s ease-in-out infinite;
    }

    .result h1 { margin-bottom: 9px; }
    .result-copy { margin: 0 auto 22px; max-width: 390px; color: var(--muted); }

    .final-score {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 25px;
      padding: 11px 18px;
      border-radius: 15px;
      background: var(--surface-soft);
      font-size: 14px;
    }

    .final-score strong { color: var(--accent); font-size: 24px; }
    .result .restart { display: block; margin: 0 auto; }
    .footer { margin: 17px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    [hidden] { display: none !important; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes pop-in {
      0% { opacity: 0; transform: scale(.97); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }

    @media (max-width: 480px) {
      body { padding: 25px 13px; }
      .brand { margin-bottom: 16px; }
      .card { border-radius: 20px; }
      .card-top { padding: 22px 20px 0; }
      .question-area { padding: 23px 20px 23px; }
      .answer { min-height: 55px; }
      .prompt { min-height: 0; margin-bottom: 20px; }
      .result { padding: 35px 21px 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand" aria-label="Cosmic Quiz">
      <span class="brand-mark" aria-hidden="true">✦</span>
      Cosmic Quiz
    </div>

    <section class="card" aria-live="polite">
      <div id="quiz">
        <div class="card-top">
          <div class="meta">
            <span id="question-count">Question 1 of 10</span>
            <span class="score"><span class="score-star" aria-hidden="true">★</span> Score <span id="score">0</span></span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="question-area">
          <p class="eyebrow">Your mission</p>
          <h1 class="prompt" id="prompt">Loading your first question…</h1>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="actions">
            <button class="next" id="next" type="button" disabled>Choose an answer</button>
          </div>
        </div>
      </div>
      <div class="result" id="result" hidden>
        <div class="result-emoji" id="result-emoji" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title">The stars are yours!</h1>
        <p class="result-copy" id="result-copy"></p>
        <div class="final-score"><strong id="final-score">0/10</strong><span>correct answers</span></div>
        <button class="restart" id="restart" type="button">Explore again <span aria-hidden="true">↻</span></button>
      </div>
    </section>
    <p class="footer">A little curiosity goes a long way. 🌙</p>
  </main>

  <script>
    "use strict";

    const questions = [
      { question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1, fact: "Mars looks rusty red because its soil is rich in iron oxide." },
      { question: "What is the name of our galaxy?", options: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], answer: 2, fact: "Our solar system sits in the Milky Way, a galaxy with billions of stars." },
      { question: "Which planet has the most prominent ring system?", options: ["Saturn", "Neptune", "Earth", "Uranus"], answer: 0, fact: "Saturn's rings are made mostly of countless pieces of ice and rock." },
      { question: "What do astronauts wear to breathe during a spacewalk?", options: ["A flight suit", "A spacesuit", "A pressure vest", "A thermal blanket"], answer: 1, fact: "A spacesuit supplies oxygen and protects astronauts from the harsh conditions of space." },
      { question: "Which is the largest planet in our solar system?", options: ["Saturn", "Earth", "Neptune", "Jupiter"], answer: 3, fact: "Jupiter is so large that more than 1,300 Earths could fit inside it." },
      { question: "What is the closest star to Earth?", options: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"], answer: 2, fact: "The Sun is a star, and its light takes about 8 minutes to reach Earth." },
      { question: "Which planet is famous for its huge, swirling Great Red Spot?", options: ["Mars", "Jupiter", "Venus", "Saturn"], answer: 1, fact: "Jupiter's Great Red Spot is a giant storm that has raged for centuries." },
      { question: "What is the name of the first human to travel into space?", options: ["Neil Armstrong", "Buzz Aldrin", "Yuri Gagarin", "Valentina Tereshkova"], answer: 2, fact: "Cosmonaut Yuri Gagarin orbited Earth in 1961 aboard Vostok 1." },
      { question: "What causes the phases of the Moon we see from Earth?", options: ["Earth's shadow", "Clouds covering the Moon", "The Moon's changing shape", "Our view of its sunlit half"], answer: 3, fact: "The Moon is always half lit by the Sun; as it orbits Earth, we see different portions of that lit half." },
      { question: "Which planet is tilted so far that it essentially spins on its side?", options: ["Uranus", "Mercury", "Mars", "Neptune"], answer: 0, fact: "Uranus has an extreme axial tilt of about 98 degrees, giving it very unusual seasons." }
    ];

    const quiz = document.querySelector("#quiz");
    const result = document.querySelector("#result");
    const questionCount = document.querySelector("#question-count");
    const progress = document.querySelector(".progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const prompt = document.querySelector("#prompt");
    const answers = document.querySelector("#answers");
    const scoreOutput = document.querySelector("#score");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next");
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const current = questions[questionIndex];
      answered = false;
      questionCount.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
      prompt.textContent = current.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.disabled = true;
      nextButton.textContent = "Choose an answer";
      answers.replaceChildren();
      current.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answers.append(button);
      });
      progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      progress.setAttribute("aria-valuenow", String(questionIndex + 1));
    }

    function selectAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const current = questions[questionIndex];
      const buttons = [...answers.children];
      buttons.forEach(button => { button.disabled = true; });
      if (selectedIndex === current.answer) {
        score += 1;
        scoreOutput.textContent = String(score);
        buttons[selectedIndex].classList.add("correct");
        feedback.textContent = `Brilliant! ${current.fact}`;
        feedback.classList.add("good");
      } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[current.answer].classList.add("correct");
        feedback.textContent = `Not quite — ${current.fact}`;
        feedback.classList.add("bad");
      }
      nextButton.disabled = false;
      nextButton.textContent = questionIndex === questions.length - 1 ? "See my results" : "Next question";
    }

    function showResults() {
      quiz.hidden = true;
      result.hidden = false;
      const ratio = score / questions.length;
      const emoji = ratio === 1 ? "🏆" : ratio >= .7 ? "🚀" : ratio >= .4 ? "🌟" : "🪐";
      const title = ratio === 1 ? "Out of this world!" : ratio >= .7 ? "Stellar work!" : ratio >= .4 ? "Nice exploring!" : "Keep reaching for the stars!";
      const copy = ratio === 1
        ? "A perfect voyage! You've got the cosmos figured out."
        : ratio >= .7
          ? "You've got serious space smarts. The universe is lucky to have you."
          : ratio >= .4
            ? "Every great explorer learns as they go. Ready for another orbit?"
            : "Every space expert starts somewhere. Your next mission awaits!";
      document.querySelector("#result-emoji").textContent = emoji;
      document.querySelector("#result-title").textContent = title;
      document.querySelector("#result-copy").textContent = copy;
      document.querySelector("#final-score").textContent = `${score}/${questions.length}`;
      document.querySelector("#restart").focus();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      questionIndex += 1;
      if (questionIndex === questions.length) showResults();
      else renderQuestion();
    });

    document.querySelector("#restart").addEventListener("click", () => {
      questionIndex = 0;
      score = 0;
      scoreOutput.textContent = "0";
      result.hidden = true;
      quiz.hidden = false;
      renderQuestion();
      answers.querySelector("button")?.focus();
    });

    renderQuestion();
  </script>
</body>
</html>
